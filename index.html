<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ozvi sa!</title>
<meta name="description" content="Otázky z publika, ankety a kvízy bez registrácie.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff5a36'/%3E%3Cpath d='M18 20h28a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H32l-9 8v-8h-5a4 4 0 0 1-4-4V24a4 4 0 0 1 4-4z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --surface2:#efece5; --ink:#17162a; --muted:#6b6879; --line:#e3dfd5;
  --accent:#ff5a36; --accent-ink:#ffffff; --accent-soft:color-mix(in srgb,var(--accent) 14%,var(--surface)); --blue:#3557ff; --green:#0f9d74; --green-soft:#dcf3ea;
  --amber:#c98a00; --amber-soft:#fbefd0; --red:#d93b3b;
  --radius:16px; --shadow:0 1px 2px rgba(23,22,42,.05),0 6px 20px rgba(23,22,42,.06);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#111020; --surface:#1b1a2d; --surface2:#25243a; --ink:#f3f1eb; --muted:#a29fb3; --line:#302f47;
    --accent-soft:color-mix(in srgb,var(--accent) 20%,var(--surface)); --green-soft:#12342a; --amber-soft:#3a2f12; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;letter-spacing:-.01em}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 80px}
.wide{max-width:1100px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.stack>*+*{margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap;
  transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{color:var(--red)}
.btn.block{width:100%}
input[type=text],input[type=number],input:not([type]),textarea,select{
  width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:84px}
label.field{display:block;font-weight:600;font-size:14px}
label.field>span{display:block;margin-bottom:6px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.badge.accent{background:var(--accent-soft);color:var(--accent)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.logo{font-family:var(--display);font-weight:800;font-size:20px;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.logo i{width:28px;height:28px;border-radius:9px;background:var(--accent);display:inline-grid;place-items:center;font-style:normal;color:var(--accent-ink);font-size:15px}
.notice{padding:12px 14px;border-radius:12px;background:var(--surface2);color:var(--muted);font-size:14px}
.notice.warn{background:var(--amber-soft);color:var(--amber)}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);margin-bottom:4px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;font-weight:700}

/* tabs & segments */
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:999px;margin:14px 0}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 10px;font-weight:600;cursor:pointer;color:var(--muted);position:relative}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.seg{display:inline-flex;gap:2px;font-size:14px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--surface2);color:var(--ink)}
.count{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;line-height:20px;text-align:center;margin-left:4px}

/* top bar (participant) */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:6px}
.topbar h1{font-size:22px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;max-width:46vw}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.conn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.conn.off::before{background:var(--red)}

/* questions */
.ask textarea{border:0;padding:4px 2px;min-height:64px;background:transparent}
.ask textarea:focus{border:0}
.ask{padding:12px 14px}
.qlist{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.q{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 14px 16px}
.q.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.q.answered{opacity:.62}
.q.pending{border-style:dashed}
.q-main{flex:1;min-width:0}
.q-meta{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.q-meta b{color:var(--ink);font-weight:600}
.q p{margin:4px 0 0;white-space:pre-wrap;word-wrap:break-word;font-size:16px}
.vote{flex:none;display:flex;flex-direction:column;align-items:center;min-width:52px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 8px;cursor:pointer;font-weight:700;line-height:1.1}
.vote svg{width:18px;height:18px}
.vote.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vote:disabled{cursor:default;opacity:.5}
.q-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.section-label{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}

/* polls (participant) */
.poll-kind{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.poll-title{font-size:24px;margin:4px 0 16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:center;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);transition:border-color .15s,background .15s}
.opt input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.stars{display:flex;gap:6px;justify-content:center;margin:8px 0}
.star{border:0;background:none;font-size:44px;line-height:1;cursor:pointer;color:var(--line);padding:0 2px;transition:transform .1s}
.star.on{color:#f5b301}
.star:hover{transform:scale(1.12)}
.ok-note{display:flex;gap:8px;align-items:center;margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--green-soft);color:var(--green);font-weight:600;font-size:14px}
.mywords{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.quiz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{border:0;border-radius:14px;padding:18px 14px;min-height:84px;color:#fff;font-weight:700;font-size:17px;text-align:left;cursor:pointer;background:var(--c);display:flex;gap:10px;align-items:center;transition:transform .08s,opacity .2s}
.qbtn:active{transform:scale(.97)}
.qbtn.dim{opacity:.28}
.qbtn.picked{outline:4px solid var(--ink);outline-offset:2px}
.qletter{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.25);font-style:normal;font-weight:800;flex:none;font-size:14px}
.bar .qletter{background:var(--c);color:#fff;margin-right:8px;width:22px;height:22px;font-size:12px}
.countdown{position:relative;height:34px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-bottom:16px}
.cd-fill{position:absolute;inset:0 auto 0 0;background:var(--blue);transition:width .2s linear}
.countdown.low .cd-fill{background:var(--red)}
.cd-num{position:relative;display:block;text-align:center;line-height:34px;font-weight:800;color:var(--ink);mix-blend-mode:normal}
.verdict{text-align:center;padding:18px;border-radius:14px;margin-bottom:14px}
.verdict b{display:block;font-family:var(--display);font-size:28px}
.verdict.good{background:var(--green-soft);color:var(--green)}
.verdict.bad{background:var(--accent-soft);color:var(--accent)}
.verdict.none{background:var(--surface2);color:var(--muted)}

/* results */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-top{display:flex;justify-content:space-between;gap:10px;font-weight:600;margin-bottom:5px;align-items:center}
.bar-label{display:flex;align-items:center;min-width:0}
.bar-val{white-space:nowrap;font-variant-numeric:tabular-nums}
.bar-val small{color:var(--muted);font-weight:500}
.bar-track{height:12px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--c);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.dim{opacity:.45}
.bar.correct .bar-label{color:var(--green)}
.ok{color:var(--green)}
.total{margin-top:14px;font-size:14px;color:var(--muted)}
.rating-res{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.avg{font-family:var(--display);font-size:56px;font-weight:800;line-height:1}
.avg small{display:block;font-size:22px;color:#f5b301;letter-spacing:2px;margin-top:6px}
.rating-res .bars{flex:1;min-width:200px}
.cloud{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;align-items:center;padding:12px 0;min-height:120px}
.cloud span{font-family:var(--display);font-weight:700;line-height:1.1;color:var(--c)}
.texts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.text-card{background:var(--surface2);border-radius:12px;padding:12px 14px;word-wrap:break-word}
.text-card small{display:block;color:var(--muted);margin-top:6px;font-size:12px}

/* home */
.hero{padding:40px 0 18px}
.hero h1{font-size:clamp(40px,9vw,64px);font-weight:800;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:18px;color:var(--muted);margin:10px 0 0;max-width:520px}
.join{display:flex;gap:8px;margin-top:22px}
.join input{font-size:22px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;text-align:center;padding:14px}
.join .btn{padding:0 24px;font-size:17px}
.features{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:28px}
.feature{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px}
.feature b{display:block;font-size:15px;margin-bottom:2px}
.myev{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.myev:first-child{border-top:0}

/* admin */
.a-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-top:10px}
.a-top h1{font-size:28px;margin-top:6px}
.a-grid{display:grid;grid-template-columns:1fr;gap:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.pl{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.pl.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pl-head{display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
.pl-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);flex:none;font-size:17px}
.pl-t{flex:1;min-width:0}
.pl-t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-t .row{gap:6px;margin-top:2px}
.pl-actions{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 14px}
.pl-res{border-top:1px solid var(--line);padding:16px;background:color-mix(in srgb,var(--surface2) 40%,var(--surface))}
.editor{margin-bottom:14px}
.editor:not([data-kind=quiz]) .quiz-only{display:none!important}
.editor[data-kind=rating] .opts-wrap,.editor[data-kind=wordcloud] .opts-wrap,.editor[data-kind=open] .opts-wrap{display:none}
.opt-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.opt-row input[type=radio]{width:22px;height:22px;accent-color:var(--green);flex:none}
.opt-row .btn{flex:none;padding:8px 11px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mode{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;cursor:pointer}
.mode b{display:block;font-size:16px}
.mode span{font-size:13px;color:var(--muted)}
.mode.on{border-color:var(--accent);background:var(--accent-soft)}
.board{list-style:none;padding:0;margin:0;counter-reset:none}
.board li{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.board li:first-child{border-top:0}
.board .rk{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.board li:nth-child(1) .rk{background:#f5b301;color:#fff}
.board li:nth-child(2) .rk{background:#a9b0bb;color:#fff}
.board li:nth-child(3) .rk{background:#c98b55;color:#fff}
.board .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .pt{font-variant-numeric:tabular-nums;font-weight:700}
.board li.me{background:var(--accent-soft);border-radius:10px;padding-left:8px;padding-right:8px}
.linkbox{display:flex;gap:8px;align-items:center}
.linkbox input{font-size:14px;font-family:ui-monospace,Menlo,monospace}
.qrbox{display:grid;place-items:center;background:#fff;border-radius:14px;padding:14px;width:max-content;margin:0 auto}
.qrbox img,.qrbox canvas{display:block}

/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,10,20,.5);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s}
.modal{background:var(--surface);border-radius:20px;padding:22px;width:100%;max-width:480px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-size:22px;margin-bottom:12px}
@keyframes fade{from{opacity:0}}
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .2s}
.toast.err{background:var(--red);color:#fff}
.loader{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* screen (projector) */
body.screen{--sbg:#14132a;--ink:#f4f2ec;background:var(--sbg);color:var(--ink);--surface:color-mix(in srgb,var(--ink) 7%,var(--sbg));--surface2:color-mix(in srgb,var(--ink) 13%,var(--sbg));--muted:color-mix(in srgb,var(--ink) 62%,var(--sbg));--line:color-mix(in srgb,var(--ink) 18%,var(--sbg));--accent-soft:color-mix(in srgb,var(--accent) 18%,var(--sbg));--green-soft:color-mix(in srgb,#0f9d74 22%,var(--sbg));overflow:hidden}
body.screen.slight{--ink:#17162a}
/* celá obrazovka: bez spodnej lišty a bez kurzora */
body.screen.fs .s-foot{display:none}
html.fs,html.fs *,body.screen.fs,body.screen.fs *{cursor:none!important}
body.screen.fs .s-wrap{padding-bottom:3vw}
body.screen.slight .s-qr,body.screen.slight .qrbox{box-shadow:0 0 0 1px var(--line)}
.ev-logo-slot:empty{display:none}
.ev-logo-slot img{display:block;object-fit:contain;max-height:44px;max-width:160px}
.p-head{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0}
.p-logo img{max-height:44px;max-width:180px}
.a-logo img{max-height:52px;max-width:200px;margin-top:10px}
.s-logo img{max-height:clamp(32px,4.6vw,88px);max-width:22vw}
.w-logo img{max-height:15vh;max-width:36vw;margin-bottom:2.4vw}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;background:var(--c)}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
.swatches input[type=color]{width:40px;height:34px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:2px;cursor:pointer}
.logo-pick{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo-pick .lp{min-width:120px;height:60px;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;padding:6px;color:var(--muted);font-size:13px;background:repeating-conic-gradient(var(--surface2) 0 25%,var(--surface) 0 50%) 0 0/16px 16px}
.logo-pick .lp img{max-height:48px;max-width:180px;display:block}
.bp{border-radius:14px;padding:16px 18px;border:1px solid var(--line)}
.bp-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;opacity:.85;margin-bottom:14px;min-height:28px}
.bp-top img{max-height:28px;max-width:120px}
.bp-title{font-size:22px;font-weight:800;line-height:1.15;margin-bottom:14px}
.bp-bar{height:10px;border-radius:99px;background:rgba(127,127,127,.22);margin-top:8px;overflow:hidden}
.bp-bar i{display:block;height:100%;border-radius:99px}
.bp-btn{display:inline-block;margin-top:14px;padding:7px 16px;border-radius:99px;font-weight:700;font-size:14px}
.s-wrap{height:100vh;display:flex;flex-direction:column;padding:2.2vw 3vw}
.s-top{display:flex;justify-content:space-between;align-items:center;gap:2vw}
.s-join{font-size:clamp(16px,1.6vw,30px);color:var(--muted)}
.s-join b{color:var(--ink)}
.s-join .code{color:var(--accent);font-size:1.25em}
.s-qr{background:#fff;border-radius:12px;padding:8px}
.s-main{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:2vw 0;overflow:hidden}
.s-foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:clamp(12px,1vw,18px)}
.s-foot button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 14px;cursor:pointer}
.s-title{font-size:clamp(28px,3.6vw,72px);font-weight:800;margin-bottom:2.4vw;letter-spacing:-.02em}
.s-welcome{display:flex;align-items:center;justify-content:center;gap:5vw;text-align:left}
.s-welcome h1{font-size:clamp(40px,5.4vw,110px);font-weight:800;letter-spacing:-.03em;max-width:46vw}
.s-welcome p{font-size:clamp(18px,2vw,38px);color:var(--muted);margin:1.4vw 0 0}
.s-welcome .bigcode{font-family:ui-monospace,Menlo,monospace;color:var(--accent);font-weight:800;font-size:clamp(40px,5vw,100px);letter-spacing:.08em}
.s-welcome .qrbox{padding:1.4vw;border-radius:2vw}
body.screen .bars{gap:1.6vw}
body.screen .bar-top{font-size:clamp(18px,2vw,40px);margin-bottom:.6vw}
body.screen .bar-track{height:clamp(14px,1.8vw,36px)}
body.screen .bar .qletter{width:1.6em;height:1.6em;font-size:.7em}
body.screen .total{font-size:clamp(14px,1.3vw,26px)}
body.screen .avg{font-size:clamp(60px,9vw,180px)}
body.screen .avg small{font-size:.3em}
body.screen .texts{grid-template-columns:repeat(auto-fill,minmax(22vw,1fr));gap:1vw}
body.screen .text-card{font-size:clamp(16px,1.5vw,30px);padding:1.2vw 1.4vw}
body.screen .cloud{min-height:40vh;gap:.6vw 2vw}
.s-hl{background:var(--accent);color:var(--accent-ink);border-radius:2vw;padding:2.2vw 2.6vw;margin-bottom:2vw}
.s-hl small{display:block;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.85;font-size:clamp(12px,1.1vw,22px)}
.s-hl p{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.2vw,64px);margin:.6vw 0 .4vw;line-height:1.15}
.s-hl span{opacity:.85;font-size:clamp(14px,1.3vw,26px)}
.s-qs{display:flex;flex-direction:column;gap:1vw}
.s-q{display:flex;gap:1.6vw;align-items:center;background:var(--surface);border-radius:1.2vw;padding:1.2vw 1.6vw}
.s-q .v{font-family:var(--display);font-weight:800;font-size:clamp(20px,2.2vw,44px);color:var(--accent);min-width:3ch;text-align:center}
.s-q p{margin:0;font-size:clamp(17px,1.8vw,36px);line-height:1.3}
.s-q small{display:block;color:var(--muted);font-size:.65em;margin-top:.3vw}
.s-quiz{display:grid;grid-template-columns:1fr 1fr;gap:1.4vw}
.s-quiz .qbtn{font-size:clamp(18px,2.2vw,44px);min-height:9vw;cursor:default;border-radius:1.4vw;padding:1.6vw}
.s-quiz .qletter{width:1.7em;height:1.7em;font-size:.75em}
.s-cd{display:flex;align-items:center;gap:2vw;margin-bottom:2vw}
.s-cd .countdown{flex:1;height:clamp(20px,2.4vw,48px);margin:0}
.s-cd .cd-num{line-height:clamp(20px,2.4vw,48px);font-size:clamp(14px,1.6vw,32px)}
.s-cd .ans{font-size:clamp(16px,1.6vw,32px);color:var(--muted);white-space:nowrap}
/* stupne víťazov */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:2vw;flex:1;min-height:0}
.pd{width:22vw;max-width:360px;display:flex;flex-direction:column;align-items:center}
.pd-who{min-height:13vh;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;margin-bottom:1.4vw;text-align:center}
.pd-name{font-family:var(--display);font-weight:800;font-size:clamp(20px,3vw,60px);line-height:1.05;max-width:22vw;overflow-wrap:anywhere}
.pd-pts{font-size:clamp(14px,1.6vw,32px);color:var(--muted);margin-top:.5vw;font-variant-numeric:tabular-nums}
.pd-q{font-family:var(--display);font-weight:800;font-size:clamp(30px,4.4vw,88px);color:var(--muted);opacity:.45}
.pd-block{width:100%;border-radius:1.2vw 1.2vw 0 0;display:grid;place-items:start center;padding-top:1.4vw;font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,100px);color:rgba(255,255,255,.92);box-shadow:inset 0 -1.2vw 2vw rgba(0,0,0,.12)}
.pd1 .pd-block{height:36vh;background:linear-gradient(#f9d35a,#dea100)}
.pd2 .pd-block{height:25vh;background:linear-gradient(#dfe4ea,#9ea7b2)}
.pd3 .pd-block{height:17vh;background:linear-gradient(#e8ad7e,#b5713d)}
.pd1.on .pd-name{color:var(--accent)}
.pd.new .pd-who{animation:pdpop .7s cubic-bezier(.2,1.5,.4,1) both}
.pd1.new .pd-block{animation:pdglow 1.6s ease-out both}
@keyframes pdpop{from{opacity:0;transform:translateY(3vw) scale(.4)}}
@keyframes pdglow{0%{filter:brightness(1.6)}100%{filter:none}}
body.screen .board li{padding:1vw 0;font-size:clamp(18px,2vw,40px)}
body.screen .board .rk{width:2em;height:2em;font-size:.75em}

@media (min-width:900px){
  .a-grid.two{grid-template-columns:1fr 340px}
}
@media (max-width:520px){
  .quiz-grid{grid-template-columns:1fr}
  .hero{padding-top:24px}
  .poll-title{font-size:21px}
  .join input{font-size:18px}
}
</style>
</head>

const S = {};

    myVotes: new Set(), since: null, lastFull: 0, offset: S.offset || 0, board: null, boardAt: 0, watch: null,
    timer: null, inFlight: false, again: false, netErr: 0, prevStatus: {}, lastActive: undefined,

function stopSync() { syncToken++; clearTimeout(S.timer); }

async function runSync(token) {
  if (token !== syncToken) return;
  if (S.inFlight) { S.again = true; return; }
  S.inFlight = true;
  try { await doSync(token); S.netErr = 0; setConn(true); }
  catch (e) {
    if (token !== syncToken) return;
    S.netErr++;
    setConn(false);
    if (/neexistuje/.test(e.message)) { stopSync(); renderGone(); return; }
    if (/Neplatný kľúč/.test(e.message)) { stopSync(); renderError('Odkaz organizátora je neplatný.'); return; }
  } finally { S.inFlight = false; }
  if (token !== syncToken) return;
  if (S.again) { S.again = false; scheduleSync(80); return; }
  const base = S.role === 'participant' ? 3000 : 2000;

  scheduleSync(ms);
}

async function doSync(token) {
  if (Date.now() - S.lastFull > 5 * 60 * 1000) S.since = null;
  const full = !S.since;
  const data = await rpc('sync', {
    p_event: S.ev.id, p_participant: PID, p_since: S.since,
    p_key: S.key || null, p_watch: S.watch || null
  });
  if (token !== syncToken) return;
  const now = new Date(data.now).getTime();
  S.offset = now - Date.now();
  S.since = new Date(now - 3000).toISOString();
  if (full) { S.q.clear(); S.polls.clear(); S.lastFull = Date.now(); }
  const oldCode = S.ev.code;
  Object.assign(S.ev, data.event);
  if (oldCode !== S.ev.code) {
    $$('.ev-code').forEach(el => { el.textContent = S.ev.code; });
    // adresa v prehliadači s novým kódom, bez znovunačítania stránky
    const r = parseRoute();
    if (r.a && r.a.toUpperCase() === (oldCode || '').toUpperCase()) {
      history.replaceState(null, '', baseUrl() + '#/' + [r.view, S.ev.code, r.b].filter(Boolean).join('/'));
    }
    if (S.role === 'participant') toast('Organizátor zmenil kód udalosti na ' + S.ev.code);
  }
  for (const q of data.questions) { if (q.status === 'deleted') S.q.delete(q.id); else S.q.set(q.id, q); }
  for (const p of data.polls) { if (p.status === 'deleted') S.polls.delete(p.id); else S.polls.set(p.id, p); }
  S.results = data.results || {};
  S.mine = data.mine || {};
  S.totals = data.totals || {};

  if (data.branding) { S.brand = data.branding; applyTheme(); if (S.role === 'admin' && !S.ui.brandDirty) initBrandForm(); }

  // rebríček – po uzavretí kvízovej otázky, alebo priebežne pre plátno

  for (const p of S.polls.values()) {
    if (p.kind !== 'quiz') continue;
    const prev = S.prevStatus[p.id];

    S.prevStatus[p.id] = p.status;

function resultsHTML(p, res, o = {}) {
  if (!res) return '';
  const total = res.total || 0;
  if (p.kind === 'choice' || p.kind === 'multi' || p.kind === 'quiz') {

    }).join('')}</div>${totalLine(total, o)}`;
  }

      <div class="bars">${[5, 4, 3, 2, 1].map(s => {

        return `<div class="bar"><div class="bar-top"><span>${s} ★</span><span class="bar-val">${pct} %<small> · ${c}</small></span></div>

      }).join('')}</div></div>${totalLine(total, o)}`;

  if (p.kind === 'wordcloud') {

      const r = await rpc('create_event', { p_name: f.elements.evname.value, p_moderation: f.moderation.checked, p_pin: f.pin.value || null });
      const list = store.get('events', []).filter(e => e.code !== r.code);
      list.unshift({ code: r.code, name: r.name, key: r.admin_key });
      store.set('events', list.slice(0, 30));
      S.justCreated = true;
      sessionStorage.setItem('ozvi:new', r.code);
      location.hash = `#/admin/${r.code}/${r.admin_key}`;
    });
  },
  async ask(f) {
    const body = f.body.value.trim();
    if (!body) return;
    await busy(f.querySelector('button'), async () => {
      const r = await rpc('ask_question', { p_event: S.ev.id, p_participant: PID, p_author: myName() || null, p_body: body });
      f.body.value = '';
      updateCounter(f.body);
      toast(r.status === 'pending' ? 'Otázka odoslaná. Zobrazí sa po schválení.' : 'Otázka odoslaná');
      kick();
    });
  },
  async vote(f) {
    const p = S.polls.get(f.dataset.poll);
    const choices = $$('input[name=opt]:checked', f).map(i => +i.value);
    if (!choices.length) return toast('Vyber možnosť', 'err');
    await submitResponse(f.querySelector('button'), p, { choices });
  },
  async text(f) {
    const p = S.polls.get(f.dataset.poll);
    const text = f.text.value.trim();
    if (!text) return;
    await submitResponse(f.querySelector('button'), p, { text }, () => { f.text.value = ''; });
  },
  async quizname(f) {
    const n = f.elements.nick.value.trim().slice(0, 40);
    if (!n) return toast('Zadaj prezývku', 'err');
    store.set('name', n);
    renderParticipantStatic();
    render();
  },
  async name(f) {
    const n = f.elements.nick.value.trim().slice(0, 40);
    store.set('name', n);
    closeModal();
    renderParticipantStatic();
    toast(n ? 'Vystupuješ ako ' + n : 'Vystupuješ anonymne');
  },
  async poll(f) { await savePoll(f, false); },
  async evcode(f) {
    const code = f.elements.evcode.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code === S.ev.code) return toast('Toto je aktuálny kód');
    if (code.length < 3 || code.length > 20) return toast('Kód musí mať 3 až 20 znakov (písmená bez diakritiky a čísla)', 'err');
    if (!confirm('Zmeniť kód z ' + S.ev.code + ' na ' + code + '?\n\nStarý kód a staré QR kódy prestanú fungovať.')) return;
    await busy(f.querySelector('button'), async () => {
      await rpc('admin_update_event', { p_event: S.ev.id, p_key: S.key, p_patch: { code } });
      const list = store.get('events', []).map(e => e.code === S.ev.code ? { ...e, code } : e);
      store.set('events', list);
      sessionStorage.setItem('ozvi:codeChanged', code);
      location.hash = `#/admin/${code}/${S.key}`;
    });
  },
  async evname(f) {
    await busy(f.querySelector('button'), async () => { await adminEvent({ name: f.elements.evname.value }); toast('Uložené'); });
  }
};
const myName = () => store.get('name', '');

async function submitResponse(btn, p, value, after) {
  if (!p) return;
  await busy(btn, async () => {
    await rpc('submit_response', { p_poll: p.id, p_participant: PID, p_author: myName() || null, p_value: value });
    if (after) after();
    // okamžitá spätná väzba, kým príde synchronizácia
    const m = S.mine[p.id] || { count: 0, points: 0, values: [] };
    if (p.kind === 'wordcloud' || p.kind === 'open') S.mine[p.id] = { ...m, count: m.count + 1, values: [...m.values, value] };
    else S.mine[p.id] = { count: 1, points: 0, values: [value] };
    if (p.kind !== 'quiz') toast('Ďakujeme, odpoveď je uložená');
    render();
    kick();
  });
}

function updateCounter(t) { const c = $('#counter'); if (c) c.textContent = t.value.length + '/500'; }
document.addEventListener('input', e => {

function renderParticipant() {
  const ev = S.ev;
  $('#evName').textContent = ev.name;
  document.title = ev.name + ' · Ozvi sa!';
  const act = activePoll();
  // nové hlasovanie -> prepni kartu
  const actId = act ? act.id + ':' + act.round : null;
  if (S.lastActive === undefined) { if (act) S.ui.tab = 'polls'; }
  else if (actId && actId !== S.lastActive) { S.ui.tab = 'polls'; toast('Začalo nové hlasovanie'); }
  S.lastActive = actId;
  $$('#ptabs button').forEach(b => b.classList.toggle('on', b.dataset.v === S.ui.tab));
  $('#tab-qa').hidden = S.ui.tab !== 'qa';
  $('#tab-polls').hidden = S.ui.tab !== 'polls';
  $('#pollDot').hidden = !(act && !S.mine[act.id]);

  // otázky
  $('#askForm').hidden = !ev.qa_open;
  $('#qaClosed').hidden = ev.qa_open;
  $$('#qsort button').forEach(b => b.classList.toggle('on', b.dataset.v === S.ui.sort));
  const all = [...S.q.values()];
  const own = all.filter(q => q.mine && q.status === 'pending');
  const live = all.filter(q => q.status === 'visible');
  const done = all.filter(q => q.status === 'answered');
  const cmp = S.ui.sort === 'top'
    ? (a, b) => (b.highlighted - a.highlighted) || (b.votes - a.votes) || b.created_at.localeCompare(a.created_at)
    : (a, b) => (b.highlighted - a.highlighted) || b.created_at.localeCompare(a.created_at);
  live.sort(cmp); done.sort(cmp);
  $('#qCount').textContent = live.length + done.length ? `${live.length + done.length} ${plural(live.length + done.length, 'otázka', 'otázky', 'otázok')}` : '';
  let html = own.map(q => qCard(q)).join('') + live.map(q => qCard(q)).join('');
  if (done.length) html += `<div class="section-label">Zodpovedané</div>` + done.map(q => qCard(q)).join('');
  if (!html) html = `<div class="empty"><b>Zatiaľ žiadne otázky</b>Buď prvý, kto sa opýta.</div>`;
  setHTML($('#qList'), html);

  // hlasovanie – keď nič nebeží, ukáž vyhodnotenie posledného (kvíz alebo zverejnené výsledky)
  const last = sortedPolls().filter(p => p.activated_at).sort((a, b) => b.activated_at.localeCompare(a.activated_at))[0];
  const featured = act || (last && last.status === 'closed' && (last.kind === 'quiz' || last.show_results) ? last : null);
  setHTML($('#pollArea'), featured ? pollCard(featured) : (S.polls.size
    ? `<div class="card empty"><b>Momentálne nie je spustené žiadne hlasovanie</b>Keď organizátor nejaké spustí, zobrazí sa tu.</div>`
    : `<div class="card empty"><b>Zatiaľ tu nič nie je</b>Keď organizátor spustí hlasovanie, zobrazí sa tu.</div>`));
  setHTML($('#pollRes'), featured ? participantResults(featured) : '');
  const past = sortedPolls().filter(p => p !== featured && p.status === 'closed' && (p.show_results || p.kind === 'quiz')).reverse();
  setHTML($('#pastPolls'), past.length ? `<div class="section-label">Predchádzajúce hlasovania</div>` + past.map(p => `
    <div class="pl"><div class="pl-head" data-act="watch" data-id="${p.id}"><div class="pl-ic">${KINDS[p.kind].icon}</div>
    <div class="pl-t"><b>${esc(p.title)}</b><span class="muted small">${KINDS[p.kind].short}</span></div><span class="muted">${S.watch === p.id ? '▴' : '▾'}</span></div>
    ${S.watch === p.id ? `<div class="pl-res">${S.results[p.id] ? resultsHTML(p, S.results[p.id]) : '<div class="muted">Načítavam…</div>'}</div>` : ''}</div>`).join('') : '');
}
function qCard(q) {
  const voted = S.myVotes.has(q.id);
  const badges = [
    q.highlighted ? '<span class="badge accent">Práve odpovedáme</span>' : '',
    q.status === 'answered' ? '<span class="badge green">Zodpovedaná</span>' : '',
    q.status === 'pending' ? '<span class="badge amber">Čaká na schválenie</span>' : '',
    q.mine && q.status !== 'pending' ? '<span class="badge">Tvoja</span>' : ''
  ].join('');
  return `<article class="q ${q.highlighted ? 'hl' : ''} ${q.status}">
    <div class="q-main"><div class="q-meta"><b>${esc(q.author || 'Anonym')}</b><span>· ${ago(q.created_at)}</span>${badges}</div>
    <p>${esc(q.body)}</p></div>
    <button class="vote ${voted ? 'on' : ''}" data-act="vote" data-id="${q.id}" ${q.status === 'pending' ? 'disabled' : ''} aria-label="Páči sa mi">${UP}<span>${q.votes}</span></button>
  </article>`;
}
function pollCard(p) {
  const mine = S.mine[p.id];
  const head = `<div class="poll-kind">${KINDS[p.kind].short}${p.status === 'closed' ? ' · ukončené' : ''}</div><h2 class="poll-title">${esc(p.title)}</h2>`;
  let body = '';
  if (p.status === 'closed' && p.kind !== 'quiz') {
    body = `<div class="notice">Hlasovanie je ukončené. ${mine ? 'Ďakujeme, že si sa zapojil(a).' : ''}</div>`;
  } else if (p.kind === 'choice' || p.kind === 'multi') {
    const sel = mine ? (mine.values[0].choices || []) : [];
    body = `<form data-form="vote" data-poll="${p.id}"><div class="opts">${p.options.map((o, i) => `
      <label class="opt"><input type="${p.kind === 'multi' ? 'checkbox' : 'radio'}" name="opt" value="${i}" ${sel.includes(i) ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('')}</div>
      ${p.kind === 'multi' ? '<p class="muted small">Môžeš vybrať viac možností.</p>' : ''}
      <button class="btn primary block" style="margin-top:14px">${mine ? 'Zmeniť hlas' : 'Hlasovať'}</button>
      ${mine ? '<div class="ok-note">✓ Tvoj hlas je zaznamenaný. Kým hlasovanie beží, môžeš ho zmeniť.</div>' : ''}</form>`;
  } else if (p.kind === 'rating') {
    const r = mine ? mine.values[0].rating : 0;
    body = `<div class="stars">${[1, 2, 3, 4, 5].map(s => `<button class="star ${s <= r ? 'on' : ''}" data-act="rate" data-id="${p.id}" data-v="${s}" aria-label="${s} z 5">★</button>`).join('')}</div>
      ${mine ? '<div class="ok-note">✓ Ďakujeme za hodnotenie. Môžeš ho ešte zmeniť.</div>' : '<p class="muted small" style="text-align:center">Klikni na hviezdičku</p>'}`;
  } else if (p.kind === 'wordcloud' || p.kind === 'open') {
    const count = mine ? mine.count : 0;
    const left = 3 - count;
    const wc = p.kind === 'wordcloud';
    body = (left > 0 ? `<form data-form="text" data-poll="${p.id}">
        ${wc ? '<input name="text" maxlength="40" placeholder="Napíš slovo alebo krátku frázu" autocomplete="off">'
             : '<textarea name="text" maxlength="500" placeholder="Napíš odpoveď…"></textarea>'}
        <button class="btn primary block" style="margin-top:10px">Odoslať</button>
        <p class="muted small">${count ? `Môžeš poslať ešte ${left} ${plural(left, 'odpoveď', 'odpovede', 'odpovedí')}.` : 'Môžeš poslať až 3 odpovede.'}</p></form>`
      : '<div class="ok-note">✓ Ďakujeme, poslal(a) si všetky 3 odpovede.</div>')
      + (count ? `<div class="mywords">${mine.values.map(v => `<span class="badge">${esc(v.text)}</span>`).join('')}</div>` : '');
  } else if (p.kind === 'quiz') {
    body = quizBody(p, mine);
  }
  return `<div class="card">${head}${body}</div>`;
}
function quizBody(p, mine) {
  const picked = mine ? mine.values[0].choices[0] : null;
  const nameHint = !myName() ? `<p class="muted small" style="text-align:center;margin-top:12px">Hráš ako Anonym. <a href="#" data-act="name">Nastav si prezývku</a>, aby si sa ukázal(a) v rebríčku.</p>` : '';
  if (p.status === 'active') {
    const expired = serverNow() > new Date(p.activated_at).getTime() + p.time_limit * 1000;
    // bez prezývky sa do kvízu nedá zapojiť – rebríček musí mať mená
    if (picked == null && !myName() && !expired) {
      return countdownHTML(p) + `<form data-form="quizname" class="stack">
        <p style="margin:0;font-weight:600">Pred odpoveďou zadaj prezývku, aby sme vedeli, kto vyhral.</p>
        <input name="nick" maxlength="40" placeholder="Tvoja prezývka" autocomplete="nickname" required>
        <button class="btn primary block">Pokračovať</button></form>`;
    }
    return countdownHTML(p) + `<div class="quiz-grid">${p.options.map((o, i) => `
      <button class="qbtn ${picked != null ? (picked === i ? 'picked' : 'dim') : ''}" style="--c:${COLORS[i % 10]}"
        data-act="quiz" data-id="${p.id}" data-v="${i}" ${picked != null || expired ? 'disabled' : ''}><i class="qletter">${LET[i]}</i>${esc(o)}</button>`).join('')}</div>
      ${picked != null ? '<div class="ok-note">✓ Odpoveď je uložená. Počkaj na vyhodnotenie…</div>' : nameHint}`;
  }
  // vyhodnotené
  let verdict;
  if (picked == null) verdict = `<div class="verdict none"><b>Bez odpovede</b>Na túto otázku si neodpovedal(a).</div>`;
  else if (picked === p.correct) verdict = `<div class="verdict good"><b>Správne!</b>+${mine.points} bodov</div>`;
  else verdict = `<div class="verdict bad"><b>Nesprávne</b>Správna odpoveď: ${esc(p.options[p.correct] ?? '')}</div>`;
  const me = S.board && S.board.me;
  return verdict + (me ? `<p style="text-align:center;margin:0">Spolu máš <b>${me.points} bodov</b> · ${me.rank}. miesto z ${S.board.players}</p>` : '') + nameHint;
}
function participantResults(p) {
  const res = S.results[p.id];
  if (!res) return '';
  if (p.kind === 'quiz' && p.status !== 'closed') return '';
  return `<div class="card" style="margin-top:12px"><div class="section-label" style="margin-top:0">Výsledky</div>${resultsHTML(p, res)}</div>`
    + (p.kind === 'quiz' && S.board ? `<div class="card" style="margin-top:12px"><div class="section-label" style="margin-top:0">Rebríček</div>${boardHTML(S.board, 5)}</div>` : '');
}

}

function nextPoll() {
  const polls = sortedPolls();
  if (!polls.length) return null;
  const act = activePoll();
  let ref = act;
  if (!ref) ref = polls.filter(p => p.activated_at).sort((a, b) => b.activated_at.localeCompare(a.activated_at))[0];
  if (!ref) return polls.find(p => p.status === 'draft') || null;
  const i = polls.indexOf(ref);
  return polls[i + 1] || null;
}

  if (q.status === 'pending') acts = A({ status: 'visible' }, '✓ Schváliť', 'primary') + A({ status: 'hidden' }, 'Zamietnuť');
  else if (q.status === 'visible') acts = (q.highlighted ? A({ highlighted: false }, 'Zrušiť zvýraznenie') : A({ highlighted: true }, '★ Zvýrazniť na plátne', 'primary'))

  else if (q.status === 'answered') acts = A({ status: 'visible' }, 'Vrátiť medzi aktívne') + A({ status: 'hidden' }, 'Skryť');
  else if (q.status === 'hidden') acts = A({ status: 'visible' }, 'Obnoviť') + A({ status: 'deleted' }, 'Zmazať natrvalo', 'danger');

async function savePoll(f, run) {
  const kind = f.elements.kind.value;
  const rows = $$('#optList .opt-row');
  const options = [];
  let correct = null;
  rows.forEach(r => {
    const v = r.querySelector('.opt-in').value.trim();
    if (!v) return;
    if (r.querySelector('input[type=radio]').checked) correct = options.length;
    options.push(v);
  });
  const data = { kind, title: f.elements.question.value, options, correct, time_limit: +f.elements.time_limit.value || 20 };
  await busy(f.querySelector('button.primary'), async () => {
    const id = await rpc('admin_save_poll', { p_event: S.ev.id, p_key: S.key, p_poll: S.editing, p_data: data });
    if (run) await rpc('admin_poll_action', { p_event: S.ev.id, p_key: S.key, p_poll: id, p_action: 'activate' });
    closeEditor();
    S.watch = id;
    toast(run ? 'Hlasovanie beží' : 'Uložené');
    kick();
  });
}

function csv(rows) {
  return '﻿' + rows.map(r => r.map(v => { v = v == null ? '' : String(v); return /[";\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';')).join('\r\n');
}
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const STATUS_SK = { pending: 'Čaká na schválenie', visible: 'Aktívna', answered: 'Zodpovedaná', hidden: 'Skrytá' };
async function exportData(which) {
  const d = await rpc('admin_export', { p_event: S.ev.id, p_key: S.key });
  const slug = S.ev.code;
  if (which === 'q') {
    download(`otazky-${slug}.csv`, csv([['Otázka', 'Autor', 'Hlasy', 'Stav', 'Čas'],
      ...d.questions.map(q => [q.body, q.author || 'Anonym', q.votes, STATUS_SK[q.status] || q.status, new Date(q.created_at).toLocaleString('sk-SK')])]));
  } else {
    const rows = [['Hlasovanie', 'Typ', 'Možnosť / odpoveď', 'Počet', 'Poznámka']];
    for (const p of d.polls) {
      const r = p.results || {};
      const k = KINDS[p.kind].short;
      if (['choice', 'multi', 'quiz'].includes(p.kind)) p.options.forEach((o, i) => rows.push([p.title, k, o, (r.counts || [])[i] || 0, p.kind === 'quiz' && i === p.correct ? 'správna' : '']));
      else if (p.kind === 'rating') { [1, 2, 3, 4, 5].forEach(s => rows.push([p.title, k, s + ' ★', (r.counts || [])[s - 1] || 0, ''])); rows.push([p.title, k, 'Priemer', r.avg != null ? String(r.avg).replace('.', ',') : '', '']); }
      else if (p.kind === 'wordcloud') (r.words || []).forEach(w => rows.push([p.title, k, w.w, w.n, '']));
      else (r.texts || []).forEach(t => rows.push([p.title, k, t.t, 1, t.a || 'Anonym']));
      rows.push([p.title, k, 'Účastníkov spolu', r.total || 0, '']);
    }
    download(`vysledky-${slug}.csv`, csv(rows));
  }
}

    <div class="bp-title" style="font-family:${f.display},sans-serif">Ako sa vám páči dnešný program?</div>
    <div class="bp-bar"><i style="width:72%;background:${d.accent}"></i></div>
    <div class="bp-bar"><i style="width:41%;background:${d.accent};opacity:.6"></i></div>
    <span class="bp-btn" style="background:${d.accent};color:${inkOn(d.accent)}">Hlasovať</span></div>`);
}
function brandChanged() { S.ui.brandDirty = true; renderBrandForm(); }
const readFile = file => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Obrázok sa nedá načítať')); i.src = src; });
async function processLogo(file) {
  if (!file) return;
  if (!/^image\/(png|jpeg|webp|gif|svg\+xml)$/.test(file.type)) return toast('Vyber obrázok PNG, JPG, WEBP alebo SVG', 'err');
  try {
    let url = await readFile(file);
    if (file.type !== 'image/svg+xml' || url.length > 200000) {
      const img = await loadImg(url);
      const w = img.naturalWidth || img.width || 600, h = img.naturalHeight || img.height || 300;
      const k = Math.min(1, 800 / w, 400 / h);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      url = c.toDataURL('image/png');
      if (url.length > 380000) url = c.toDataURL('image/webp', 0.88);
      if (url.length > 380000) url = c.toDataURL('image/jpeg', 0.85);
    }
    if (url.length > 390000) return toast('Logo je príliš veľké, skús menší obrázok', 'err');
    S.draft.logo = url; S.draft.logoChanged = true;
    brandChanged();
  } catch (e) { toast(errMsg(e), 'err'); }
}
async function saveBrand(btn) {
  const d = S.draft;
  await busy(btn, async () => {
    const patch = { theme: { accent: d.accent, screen_bg: d.screen_bg, font: d.font } };
    if (d.logoChanged) patch.logo = d.logo || '';
    await rpc('admin_update_event', { p_event: S.ev.id, p_key: S.key, p_patch: patch });
    S.brand = { theme: patch.theme, logo: d.logo || null };
    d.logoChanged = false;
    S.ui.brandDirty = false;
    applyTheme();
    toast('Vzhľad je uložený');
    kick();
  });
}

/* =====================================================================
   PLÁTNO (projektor)
   ===================================================================== */
async function enterScreen(code, key) {
  loading();
  const ev = await rpc('admin_login', { p_code: code, p_key: key });
  S.role = 'screen';
  S.ev = ev;
  S.key = key;
  document.body.classList.add('screen');
  updateFs();
  document.title = 'Plátno · ' + ev.name;
  app.innerHTML = `<div class="s-wrap">
    <header class="s-top" id="sTop"><div class="row" style="gap:2vw;flex-wrap:nowrap"><span class="ev-logo-slot s-logo"></span><div class="s-join">Ozvi sa na <b>${esc(prettyHost())}</b> · kód <span class="code ev-code">${esc(ev.code)}</span></div></div><div class="s-qr" id="sQr"></div></header>
    <main class="s-main" id="sMain"></main>
    <footer class="s-foot"><span id="evName">${esc(ev.name)}</span><span class="row"><span class="conn">Pripájam…</span><button data-act="fullscreen">⛶ Celá obrazovka</button></span></footer>
  </div>`;
  runSync(syncToken);
}
function renderScreen() {
  const ev = S.ev;
  $('#evName').textContent = ev.name;
  const mode = ev.present_mode;
  const qrSize = Math.round(Math.min(innerWidth, innerHeight) * 0.11);
  $('#sTop').style.visibility = mode === 'welcome' ? 'hidden' : 'visible';
  if (mode !== 'welcome') makeQR($('#sQr'), joinUrl(ev.code), qrSize);
  let html = '';
  if (mode === 'welcome') {
    html = `<div class="s-welcome"><div><span class="ev-logo-slot w-logo"></span><h1>${esc(ev.name)}</h1>
      <p>Ozvi sa na <b style="color:var(--ink)">${esc(prettyHost())}</b></p><p>a zadaj kód</p><div class="bigcode">${esc(ev.code)}</div></div>
      <div class="qrbox" id="bigQr"></div></div>${localNote()}`;
  } else if (mode === 'qa') {
    const qs = [...S.q.values()].filter(q => q.status === 'visible');
    const hl = qs.find(q => q.highlighted);
    const rest = qs.filter(q => !q.highlighted).sort((a, b) => b.votes - a.votes || a.created_at.localeCompare(b.created_at)).slice(0, hl ? 4 : 6);
    html = (hl ? `<div class="s-hl"><small>Práve odpovedáme</small><p>${esc(hl.body)}</p><span>${esc(hl.author || 'Anonym')} · ${hl.votes} ${plural(hl.votes, 'hlas', 'hlasy', 'hlasov')}</span></div>`
      : `<div class="s-title">Otázky z publika</div>`)
      + (rest.length ? `<div class="s-qs">${rest.map(q => `<div class="s-q"><div class="v">${q.votes}</div><p>${esc(q.body)}<small>${esc(q.author || 'Anonym')}</small></p></div>`).join('')}</div>`
        : (hl ? '' : `<div class="empty" style="font-size:2vw">Zatiaľ žiadne otázky. Pošli prvú!</div>`));
  } else if (mode === 'poll') {
    const p = S.polls.get(ev.present_poll);
    if (!p) html = `<div class="s-title">Hlasovanie</div><div class="empty" style="font-size:2vw">Vyber hlasovanie v správe udalosti.</div>`;
    else {
      const res = S.results[p.id];
      html = `<div class="s-title">${esc(p.title)}</div>`;
      if (p.status === 'draft') html += `<div class="empty" style="font-size:2vw">Hlasovanie ešte nezačalo.</div>`;
      else if (p.kind === 'quiz' && p.status === 'active') {
        const n = res ? res.total : 0;
        html += `<div class="s-cd">${countdownHTML(p)}<span class="ans">${n} ${plural(n, 'odpoveď', 'odpovede', 'odpovedí')}</span></div>
          <div class="s-quiz">${p.options.map((o, i) => `<div class="qbtn" style="--c:${COLORS[i % 10]}"><i class="qletter">${LET[i]}</i>${esc(o)}</div>`).join('')}</div>`;
      } else html += resultsHTML(p, res || { total: 0, counts: [], words: [], texts: [] }, { big: true });
    }
  } else if (mode === 'podium') {
    html = podiumHTML(S.board, ev.podium_step || 0);
  } else if (mode === 'leaderboard') {
    html = `<div class="s-title">Rebríček</div>${boardHTML(S.board, 8)}`;
  }
  setHTML($('#sMain'), html);
  if (mode === 'welcome') makeQR($('#bigQr'), joinUrl(ev.code), Math.round(Math.min(innerWidth * 0.3, innerHeight * 0.55)));
}
function updateFs() {
  // celá obrazovka cez tlačidlo (Fullscreen API) aj cez kláves F11 / zelené tlačidlo v okne
  const fs = !!document.fullscreenElement || (Math.abs(innerHeight - screen.height) < 3 && Math.abs(innerWidth - screen.width) < 3);
  document.body.classList.toggle('fs', fs && S.role === 'screen');
  document.documentElement.classList.toggle('fs', fs && S.role === 'screen');
}
document.addEventListener('fullscreenchange', updateFs);
window.addEventListener('resize', updateFs);
window.addEventListener('resize', () => { if (S.role === 'screen') { $$('#sQr,#bigQr').forEach(e => e.__qr = null); renderScreen(); } });

/* =====================================================================
   UDALOSTI KLIKNUTÍ
   ===================================================================== */
const ACTIONS = {
  tab(el) { S.ui.tab = el.dataset.v; render(); },
  sort(el) { S.ui.sort = el.dataset.v; render(); },
  name(el, e) { e.preventDefault(); openNameModal(); },
  closeModal() { closeModal(); },
  copy(el) { copyText(el.dataset.v); },
  async vote(el) {
    const id = el.dataset.id, q = S.q.get(id);
    if (!q) return;
    const was = S.myVotes.has(id);
    was ? S.myVotes.delete(id) : S.myVotes.add(id);
    q.votes += was ? -1 : 1;
    render();
    try {
      const r = await rpc('vote_question', { p_question: id, p_participant: PID });
      r.voted ? S.myVotes.add(id) : S.myVotes.delete(id);
      q.votes = r.votes;
      render();
    } catch (e) {
      was ? S.myVotes.add(id) : S.myVotes.delete(id);
      q.votes += was ? 1 : -1;
      render();
      toast(errMsg(e), 'err');
    }
  },
  async rate(el) { await submitResponse(null, S.polls.get(el.dataset.id), { rating: +el.dataset.v }); },
  async quiz(el) {
    if (!myName()) { render(); return; }
    $$('.qbtn').forEach(b => b.disabled = true);
    await submitResponse(null, S.polls.get(el.dataset.id), { choices: [+el.dataset.v] });
    render();
  },
  watch(el) { S.watch = S.watch === el.dataset.id ? null : el.dataset.id; render(); kick(); },
  // organizátor
  atab(el) { S.ui.atab = el.dataset.v; render(); },
  qf(el) { S.ui.qf = el.dataset.v; S.ui.qfTouched = true; render(); },
  async qset(el) {
    const patch = JSON.parse(el.dataset.v);
    if (patch.status === 'deleted' && !confirm('Natrvalo zmazať túto otázku?')) return;
    await busy(el, async () => {
      await rpc('admin_question', { p_event: S.ev.id, p_key: S.key, p_question: el.dataset.id, p_patch: patch });
      const q = S.q.get(el.dataset.id);
      if (patch.highlighted) {
        for (const o of S.q.values()) o.highlighted = false;
        // zvýraznená otázka sa hneď ukáže na plátne
        if (S.ev.present_mode !== 'qa') await rpc('admin_update_event', { p_event: S.ev.id, p_key: S.key, p_patch: { present_mode: 'qa' } });
        S.ev.present_mode = 'qa';
      }
      if (q) { Object.assign(q, patch); if (patch.status && patch.status !== 'visible') q.highlighted = false; if (q.status === 'deleted') S.q.delete(q.id); }
      render();
      kick();
    });
  },
  async pa(el) {
    const v = el.dataset.v, id = el.dataset.id;
    if (v === 'delete' && !confirm('Zmazať toto hlasovanie aj s odpoveďami?')) return;
    if (v === 'reset' && !confirm('Vymazať všetky doterajšie odpovede v tomto hlasovaní?')) return;
    await busy(el, async () => {
      await rpc('admin_poll_action', { p_event: S.ev.id, p_key: S.key, p_poll: id, p_action: v });
      if (v === 'activate') S.watch = id;
      if (v === 'delete') S.polls.delete(id);
      kick();
    });
  },
  newPoll() { openEditor(null); },
  editPoll(el) { openEditor(S.polls.get(el.dataset.id)); },
  cancelEdit() { closeEditor(); },
  addOpt() { const r = addOptRow(); if (r) r.querySelector('.opt-in').focus(); },
  delOpt(el) {
    const row = el.closest('.opt-row');
    if ($$('#optList .opt-row').length <= 2) { row.querySelector('.opt-in').value = ''; return; }
    const wasCorrect = row.querySelector('input[type=radio]').checked;
    row.remove();
    if (wasCorrect) { const r = $('#optList input[type=radio]'); if (r) r.checked = true; }
  },
  async saveRun() { await savePoll($('#editor'), true); },
  async mode(el) { await busy(el, () => adminEvent({ present_mode: el.dataset.v })); },
  share() { openShareModal(false); },
  async podiumShow(el) { await busy(el, () => adminEvent({ present_mode: 'podium' })); },
  async podiumNext(el) { await busy(el, async () => { await loadBoard(); await adminEvent({ present_mode: 'podium', podium_step: Math.min(3, (S.ev.podium_step || 0) + 1) }); }); },
  async podiumReset(el) { await busy(el, () => adminEvent({ podium_step: 0 })); },
  swatch(el) { S.draft[el.dataset.k] = el.dataset.v; brandChanged(); },
  logoRemove() { S.draft.logo = ''; S.draft.logoChanged = true; brandChanged(); },
  async saveBrand(el) { await saveBrand(el); },
  resetBrand() { Object.assign(S.draft, BRAND_DEFAULT, { logo: '', logoChanged: !!(S.brand && S.brand.logo) }); brandChanged(); },
  async exportQ(el) { await busy(el, () => exportData('q')); },
  async exportP(el) { await busy(el, () => exportData('p')); },
  async delEvent(el) {
    if (!confirm('Naozaj natrvalo vymazať udalosť „' + S.ev.name + '“ so všetkými otázkami a odpoveďami?')) return;
    await busy(el, async () => {
      await rpc('admin_delete_event', { p_event: S.ev.id, p_key: S.key });
      store.set('events', store.get('events', []).filter(e => e.code !== S.ev.code));
      toast('Udalosť bola vymazaná');
      location.hash = '#/';
    });
  },
  fullscreen() {
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset.form && FORMS[f.dataset.form]) { e.preventDefault(); FORMS[f.dataset.form](f); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'logoFile') { processLogo(el.files[0]); el.value = ''; return; }
  if (el.dataset.brand && S.draft) { S.draft[el.dataset.brand] = el.value; brandChanged(); return; }
  if (el.dataset.toggle) {
    const patch = { [el.dataset.toggle]: el.checked };
    try { await adminEvent(patch); toast('Uložené'); } catch (err) { el.checked = !el.checked; toast(errMsg(err), 'err'); }
  } else if (el.dataset.change === 'kind') {
    $('#editor').dataset.kind = el.value;
    if (['choice', 'multi', 'quiz'].includes(el.value) && !$('#optList input[type=radio]:checked')) { const r = $('#optList input[type=radio]'); if (r) r.checked = true; }
  } else if (el.dataset.change === 'presentPoll' && el.value) {
    try { await adminEvent({ present_mode: 'poll', present_poll: el.value }); } catch (err) { toast(errMsg(err), 'err'); }
  }
});

route();
})();
</script>
