# Udržiava bezplatnú databázu Supabase v chode.
# Supabase uspí bezplatný projekt po 7 dňoch bez používania – táto úloha sa mu ozve každé 3 dni.
# GitHub zas vypína plánované úlohy v repozitári, kde sa 60 dní nič nezmenilo,
# preto raz za mesiac zapíše dátum do súboru keepalive.txt.
name: Udržiavanie databázy v chode

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ozvať sa databáze
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://psgwanvqltxnmogpuszk.supabase.co/rest/v1/rpc/get_event" \
            -H "apikey: sb_publishable_YmNVGjen-rxLukxfNRgckA_lrDqiHdJ" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"KEEPALIVE"}')
          echo "Databáza odpovedala kódom $code"
          test "$code" = "200"

      - uses: actions/checkout@v4

      - name: Raz za mesiac zapísať dátum (aby GitHub úlohu nevypol)
        run: |
          if [ "$(date +%d)" -le 3 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            date -u +"%Y-%m-%d %H:%M UTC" > keepalive.txt
            git config user.name "ozvisa-bot"
            git config user.email "ozvisa-bot@users.noreply.github.com"
            git add keepalive.txt
            git commit -m "Udržiavanie v chode" || echo "Bez zmeny"
            git push
          fi
